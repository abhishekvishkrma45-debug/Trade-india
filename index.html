<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Trading Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .wallet { font-size: 22px; margin-bottom: 15px; color: #4caf50; }
        .timer { font-size: 18px; color: #ffeb3b; margin-bottom: 20px; }
        
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: white; font-size: 16px; box-sizing: border-box; }
        .bet-input { width: 120px; text-align: center; }
        
        .btn { padding: 12px 24px; font-size: 16px; border: none; cursor: pointer; border-radius: 6px; margin: 5px; font-weight: bold; width: 100%; box-sizing: border-box; }
        .bet-btn { width: auto; }
        .quick-btn { padding: 6px 12px; font-size: 12px; margin: 3px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
        
        .green { background: #4caf50; color: white; }
        .red { background: #f44336; color: white; }
        .violet { background: #9c27b0; color: white; }
        .blue { background: #2196F3; color: white; }
        .deposit-btn { background: #ff9800; color: white; margin-bottom: 10px; }
        .logout-btn { background: #757575; color: white; margin-top: 15px; }
        
        #game-container, #register-box, #deposit-box { display: none; }
        .history { margin-top: 20px; text-align: left; }
        .history-item { padding: 8px; border-bottom: 1px solid #333; }
        .link { color: #2196F3; cursor: pointer; text-decoration: underline; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>

<div id="auth-container" class="card">
    <div id="login-box">
        <h2>Login Karein</h2>
        <input type="text" id="login-user" placeholder="Username (Mobile No.)">
        <input type="password" id="login-pass" placeholder="Password">
        <button class="btn blue" onclick="login()">Login</button>
        <p class="link" onclick="showRegister()">Naya account banayein</p>
    </div>

    <div id="register-box">
        <h2>Naya Account Banayein</h2>
        <input type="text" id="reg-user" placeholder="Username (Mobile No.)">
        <input type="password" id="reg-pass" placeholder="Password">
        <button class="btn green" onclick="register()">Register</button>
        <p class="link" onclick="showLogin()">Pehle se account hai? Login karein</p>
    </div>
    
    <p id="auth-status" style="color: red; margin-top: 10px; font-weight: bold;"></p>
</div>

<div id="game-container" class="card">
    <h2>Colour Prediction</h2>
    <p style="color:#aaa;">Welcome, <b id="display-user">User</b></p>
    <div class="wallet">Coins: ₹<span id="balance">0</span></div>
    
    <button class="btn deposit-btn" onclick="showDeposit()">+ Add Coins (Deposit)</button>
