<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Investment Calculator Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .calculator-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h2 {
      font-size: 1.5rem;
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .label-row span.val {
      color: #38bdf8;
      font-weight: 600;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      transition: all 0.2s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #0f172a;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .btn:hover {
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .result-box {
      margin-top: 24px;
      padding: 20px;
      background: #0f172a;
      border-radius: 12px;
      border: 1px solid #1e293b;
      display: none;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: #94a3b8;
    }

    .result-row.total {
      margin-bottom: 0;
      padding-top: 12px;
      border-top: 1px solid #334155;
      color: #f1f5f9;
      font-weight: 700;
    }

    .result-row.total .highlight {
      color: #22c55e;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <div class="header">
      <h2>Investment Plan</h2>
      <p>Calculate your expected returns and total growth</p>
    </div>

    <div class="input-group">
      <div class="label-row">
        <label for="amount">Investment Amount (₹)</label>
      </div>
      <input type="number" id="amount" placeholder="e.g. 50000" />
    </div>

    <div class="input-group">
      <div class="label-row">
        <label for="rate">Expected Annual Return (%)</label>
      </div>
      <input type="number" id="rate" placeholder="e.g. 12" step="0.1" />
    </div>

    <div class="input-group">
      <div class="label-row">
        <label for="years">Time Horizon (Years)</label>
      </div>
      <input type="number" id="years" placeholder="e.g. 5" />
    </div>

    <button class="btn" onclick="calculateInvestment()">Calculate Plan</button>

    <div class="result-box" id="resultBox">
      <div class="result-row">
        <span>Invested Amount</span>
        <span id="invested">₹0</span>
      </div>
      <div class="result-row">
        <span>Estimated Profit</span>
        <span id="profit" style="color: #38bdf8;">₹0</span>
      </div>
      <div class="result-row total">
        <span>Total Future Value</span>
        <span id="total" class="highlight">₹0</span>
      </div>
    </div>
  </div>

  <script>
    function calculateInvestment() {
      const P = parseFloat(document.getElementById('amount').value);
      const R = parseFloat(document.getElementById('rate').value);
      const N = parseFloat(document.getElementById('years').value);

      if (isNaN(P) || isNaN(R) || isNaN(N) || P <= 0 || R <= 0 || N <= 0) {
        alert('Kripya sabhi fields me sahi number dalein.');
        return;
      }

      const totalVal = P * Math.pow((1 + R / 100), N);
      const profitVal = totalVal - P;

      document.getElementById('invested').innerText = '₹' + Math.round(P).toLocaleString('en-IN');
      document.getElementById('profit').innerText = '₹' + Math.round(profitVal).toLocaleString('en-IN');
      document.getElementById('total').innerText = '₹' + Math.round(totalVal).toLocaleString('en-IN');

      document.getElementById('resultBox').style.display = 'block';
    }
  </script>

</body>
</html>
