<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Trading Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; padding: 20px; margin: 0; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); box-sizing: border-box; }
        .wallet { font-size: 22px; margin-bottom: 15px; color: #4caf50; }
        .timer { font-size: 18px; color: #ffeb3b; margin-bottom: 20px; }
        
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: white; font-size: 16px; box-sizing: border-box; }
        .bet-input { width: 120px; text-align: center; display: inline-block; }
        
        .btn { padding: 12px 24px; font-size: 16px; border: none; cursor: pointer; border-radius: 6px; margin: 8px 0; font-weight: bold; width: 100%; box-sizing: border-box; display: block; }
        .bet-btn { width: auto; display: inline-block; margin: 4px; }
        .quick-btn { padding: 6px 12px; font-size: 12px; margin: 3px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
        
        .green { background: #4caf50; color: white; }
        .red { background: #f44336; color: white; }
        .violet { background: #9c27b0; color: white; }
        .blue { background: #2196F3; color: white; }
        .deposit-btn { background: #ff9800; color: white; margin-bottom: 10px; }
        .logout-btn { background: #757575; color: white; margin-top: 15px; }
        
        .history { margin-top: 20px; text-align: left; }
        .history-item { padding: 8px; border-bottom: 1px solid #333; }
        .link { color: #2196F3; cursor: pointer; text-decoration: underline; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>

<!-- AUTH SECTION -->
<div id="auth-container" class="card">
    <div id="login-box">
        <h2>Login Karein</h2>
        <input type="text" id="login-user" placeholder="Username (Mobile No.)">
        <input type="password" id="login-pass" placeholder="Password">
        <button class="btn blue" onclick="login()">Login</button>
        <span class="link" onclick="showRegister()">Naya account banayein (Register)</span>
    </div>

    <div id="register-box" style="display: none;">
        <h2>Naya Account Banayein</h2>
        <input type="text" id="reg-user" placeholder="Username (Mobile No.)">
        <input type="password" id="reg-pass" placeholder="Password">
        <button class="btn green" onclick="register()">Register</button>
        <span class="link" onclick="showLogin()">Pehle se account hai? Login karein</span>
    </div>
    
    <p id="auth-status" style="color: red; margin-top: 10px; font-weight: bold;"></p>
</div>

<!-- GAME SECTION -->
<div id="game-container" class="card" style="display: none;">
    <h2>Colour Prediction</h2>
    <p style="color:#aaa;">Welcome, <b id="display-user">User</b></p>
    <div class="wallet">Coins: ₹<span id="balance">0</span></div>
    
    <button class="btn deposit-btn" onclick="showDeposit()">+ Add Coins (Deposit)</button>
    
    <div class="timer">Agla Result: <span id="timer">10</span>s</div>

    <div class="bet-box">
        <label>Bet Amount (₹): </label><br><br>
        <input type="number" id="customBet" class="bet-input" value="10" min="10">
        <br><br>
        <button class="quick-btn" onclick="setBet(10)">₹10</button>
        <button class="quick-btn" onclick="setBet(50)">₹50</button>
        <button class="quick-btn" onclick="setBet(100)">₹100</button>
        <button class="quick-btn" onclick="setBet(500)">₹500</button>
    </div>

    <p>Apna Colour Chune:</p>
    <button class="btn bet-btn green" onclick="placeBet('Green')">Green (2x)</button>
    <button class="btn bet-btn red" onclick="placeBet('Red')">Red (2x)</button>
    <button class="btn bet-btn violet" onclick="placeBet('Violet')">Violet (4.5x)</button>

    <p id="status" style="margin-top: 15px; font-weight: bold;"></p>

    <div class="history">
        <h3>Previous Results:</h3>
        <div id="history-list"></div>
    </div>
    
    <button class="btn logout-btn" onclick="logout()">Logout</button>
</div>

<!-- DEPOSIT POPUP BOX -->
<div id="deposit-box" class="card" style="display: none;">
    <h2>Deposit / Recharge</h2>
    <p>Is UPI ID par PhonePe/GPay se payment karein:</p>
    <p style="background: #333; padding: 12px; border-radius: 6px; font-weight: bold; color: #ffeb3b; font-size: 18px; user-select: all;">mohitcsc@jio</p>
    
    <input type="number" id="dep-amount" placeholder="Amount (e.g. 100)">
    <input type="text" id="dep-utr" placeholder="UTR / Transaction ID">
    
    <button class="btn green" onclick="submitDeposit()">Submit Deposit Request</button>
    <button class="btn logout-btn" onclick="closeDeposit()">Back to Game</button>
    <p id="dep-status" style="margin-top: 10px; font-weight: bold;"></p>
</div>

<script>
    let currentUser = null;
    let balance = 0;

    function showRegister() {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('register-box').style.display = 'block';
        document.getElementById('auth-status').innerText = "";
    }

    function showLogin() {
        document.getElementById('register-box').style.display = 'none';
        document.getElementById('login-box').style.display = 'block';
        document.getElementById('auth-status').innerText = "";
    }

    function register() {
        let user = document.getElementById('reg-user').value.trim();
        let pass = document.getElementById('reg-pass').value.trim();

        if(!user || !pass) {
            document.getElementById('auth-status').innerText = "Sahi details bharein!";
            return;
        }
        
        if(localStorage.getItem(user) !== null) {
            document.getElementById('auth-status').innerText = "Username pehle se majood hai!";
            return;
        }

        localStorage.setItem(user, JSON.stringify({ password: pass, coins: 100 }));
        document.getElementById('auth-status').style.color = "green";
        document.getElementById('auth-status').innerText = "Account ban gaya! Bonus ₹100 Added. Ab Login Karein.";
        setTimeout(showLogin, 1500);
    }

    function login() {
        let user = document.getElementById('login-user').value.trim();
        let pass = document.getElementById('login-pass').value.trim();

        let userData = JSON.parse(localStorage.getItem(user));

        if(userData && userData.password === pass) {
            currentUser = user;
            balance = userData.coins;
            
            document.getElementById('display-user').innerText = currentUser;
            document.getElementById('balance').innerText = balance;
            
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
        } else {
            document.getElementById('auth-status').style.color = "red";
            document.getElementById('auth-status').innerText = "Username ya Password galat hai!";
        }
    }

    function logout() {
        currentUser = null;
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('auth-container').style.display = 'block';
        document.getElementById('login-user').value = "";
        document.getElementById('login-pass').value = "";
        document.getElementById('auth-status').innerText = "";
    }

    function updateDatabaseBalance() {
        if(currentUser) {
            let userData = JSON.parse(localStorage.getItem(currentUser));
            userData.coins = balance;
            localStorage.setItem(currentUser, JSON.stringify(userData));
        }
    }

    function showDeposit() {
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('deposit-box').style.display = 'block';
    }

    function closeDeposit() {
        document.getElementById('deposit-box').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
    }

    function submitDeposit() {
        let amt = parseFloat(document.getElementById('dep-amount').value);
        let utr = document.getElementById('dep-utr').value.trim();

        if(!amt || amt <= 0 || !utr) {
            document.getElementById('dep-status').innerText = "Kripya Sahi Amount aur UTR bharein!";
            document.getElementById('dep-status').style.color = "red";
            return;
        }

        balance += amt;
        updateDatabaseBalance();
        document.getElementById('balance').innerText = balance;

        document.getElementById('dep-status').innerText = "Deposit Successful! ₹" + amt + " Added.";
        document.getElementById('dep-status').style.color = "green";
        
        setTimeout(() => {
            closeDeposit();
            document.getElementById('dep-status').innerText = "";
            document.getElementById('dep-amount').value = "";
            document.getElementById('dep-utr').value = "";
        }, 1500);
    }

    let selectedColour = null;
    let currentBetAmount = 10;
    let timeLeft = 10;

    function setBet(amount) { document.getElementById('customBet').value = amount; }

    function updateTimer() {
        if(!currentUser) return;
        document.getElementById('timer').innerText = timeLeft;
        if (timeLeft === 0) {
            calculateResult();
            timeLeft = 10;
        } else {
            timeLeft--;
        }
    }

    setInterval(updateTimer, 1000);

    function placeBet(colour) {
        let betInput = parseFloat(document.getElementById('customBet').value);

        if (isNaN(betInput) || betInput <= 0 || balance < betInput) {
            document.getElementById('status').innerText = "Insufficient Balance ya Galat Amount!";
            document.getElementById('status').style.color = "red";
            return;
        }

        currentBetAmount = betInput;
        selectedColour = colour;
        document.getElementById('status').innerText = "Bet Placed: ₹" + currentBetAmount + " on " + colour;
        document.getElementById('status').style.color = "#ffeb3b";
    }

    function calculateResult() {
        let randomIndex = Math.floor(Math.random() * 10);
        let winningColour = '';
        
        if (randomIndex === 0) winningColour = 'Violet';
        else if (randomIndex % 2 === 0) winningColour = 'Green';
        else winningColour = 'Red';

        let statusText = "Result: " + winningColour;

        if (selectedColour !== null) {
            if (selectedColour === winningColour) {
                let winMultiplier = winningColour === 'Violet' ? 4.5 : 2;
                let winAmt = currentBetAmount * winMultiplier;
                balance += winAmt;
                statusText += " | Aap Jeet Gaye ₹" + winAmt + "!";
            } else {
                balance -= currentBetAmount;
                statusText += " | Aap Haar Gaye ₹" + currentBetAmount;
            }
            updateDatabaseBalance();
        }

        document.getElementById('balance').innerText = balance;
        document.getElementById('status').innerText = statusText;
        document.getElementById('status').style.color = "white";

        let historyList = document.getElementById('history-list');
        let item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<span>Result: <b>${winningColour}</b></span>`;
        historyList.prepend(item);

        selectedColour = null;
    }
</script>

</body>
</html>
